name: Windows build and verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Core and GUI tests
        run: python -m pytest -q
      - name: Compile Python
        run: python -m compileall -q app.py core.py labview_mock.py
      - name: Static security report
        run: python -m bandit -r core.py app.py -f json -o bandit.json
        continue-on-error: true
      - name: Dependency vulnerability report
        run: python -m pip_audit -f json -o pip-audit.json
        continue-on-error: true
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name SystemWindow app.py
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit.json
            pip-audit.json
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: SystemWindow-Windows-x64
          path: dist/SystemWindow/
          if-no-files-found: error
